<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wplayer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.1.0/global.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.1.0/video.js"></script>
<style>
  body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center;
         background: #0d0e11; color: #e8e8ea; font: 15px/1.5 system-ui, sans-serif; }
  main { padding: 16px; box-sizing: border-box; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 auto 10px; overflow-wrap: anywhere; text-align: center; }
  /* Fill the width; height is the window minus the title, but no taller than 16:9 on narrow screens.
     The video letterboxes inside. */
  video-skin { display: block; width: 100%; height: min(calc(100dvh - 80px), calc((100vw - 32px) * 9 / 16));
               border-radius: 0; --media-border-radius: 0; overflow: hidden; background: #000; }
  #notice { color: #f5b14c; }
  #notice:empty { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <video-player>
    <video-skin>
      <video id="video" playsinline></video>
    </video-skin>
  </video-player>
  <p id="notice"></p>
</main>
<script type="module">
// What to play (wprep.py fills these in). ?src=URL in the page address overrides SRC.
const SRC = "";
const SUBS = [];  // [{src: "film.en.vtt", lang: "en", label: ""}]

const video = document.getElementById("video");
const src = new URLSearchParams(location.search).get("src") || SRC;
const names = new Intl.DisplayNames(["en"], { type: "language" });
const langName = (code) => { try { return names.of(code); } catch { return code; } };

for (const s of SUBS) {
  const track = Object.assign(document.createElement("track"),
    { kind: "subtitles", src: s.src, label: s.label || langName(s.lang) || "Subtitles" });
  if (s.lang) track.srclang = s.lang;
  // Lift cues a few lines off the bottom so the control bar doesn't cover them (the skin only does this in Chrome).
  track.addEventListener("load", () => {
    for (const cue of track.track.cues) cue.line = -3;
  });
  video.append(track);
}
video.src = src;
document.title = document.getElementById("title").textContent =
  decodeURIComponent(src.split("/").pop()).replace(/\.[^.]+$/, "");

// The skin darkens the video while the controls show; switch that gradient off.
// It lives in the skin's shadow DOM, so page CSS can't reach it.
customElements.whenDefined("video-skin").then(() => {
  const style = document.createElement("style");
  style.textContent = ".video-controls-backdrop { display: none !important; }";
  document.querySelector("video-skin").shadowRoot?.append(style);
});

// A browser that can't decode the video (usually HEVC) plays the audio over black instead of erroring.
video.addEventListener("loadeddata", () => {
  if (!video.videoWidth) document.getElementById("notice").textContent =
    "This browser can't play this video's format (probably HEVC/H.265). Try Chrome, Edge or Safari.";
}, { once: true });

// Resume where you left off.
const key = "wplayer:" + new URL(src, location.href).href;
video.addEventListener("loadedmetadata", () => {
  let saved = 0;
  try { saved = parseFloat(localStorage.getItem(key)) || 0; } catch {}
  if (saved > 10 && saved < video.duration - 10) video.currentTime = saved;
}, { once: true });
video.addEventListener("pause", () => {
  try { localStorage.setItem(key, video.currentTime); } catch {}
});
setInterval(() => {
  if (!video.paused) try { localStorage.setItem(key, video.currentTime); } catch {}
}, 5000);
</script>
</body>
</html>
